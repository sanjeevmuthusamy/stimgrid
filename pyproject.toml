[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stimgrid"
version = "0.2.0"
description = "Fit stimulation pulses to what a stimulator can actually produce, and find the nearest exactly charge-balanced pulse."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sanjeev Muthusamy" }]
dependencies = []
keywords = [
  "neuroscience", "electrophysiology", "neurostimulation", "electrical stimulation", "microstimulation",
  "charge balance", "charge-balanced", "biphasic pulse", "asymmetric pulse", "stimulation safety",
  "multi-electrode array", "MEA", "microelectrode", "neural interface", "brain-computer interface",
  "DAC quantization", "Intan", "RHS2116", "Multi Channel Systems", "STG4000", "STG5",
  "Tucker-Davis Technologies", "IZ2", "Cortical Labs",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/sanjeevmuthusamy/stimgrid"
Issues = "https://github.com/sanjeevmuthusamy/stimgrid/issues"

[project.scripts]
stimgrid = "stimgrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
