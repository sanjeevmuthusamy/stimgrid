[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stimgrid"
version = "0.4.1"
description = "Fit stimulation pulses to what a stimulator can actually produce, and find the nearest exactly charge-balanced pulse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sanjeev Muthusamy", email = "sanjeevmuthusamy@bastionoid.com" }]
dependencies = []
keywords = [
  "neuroscience", "electrophysiology", "neurostimulation", "electrical stimulation", "microstimulation",
  "charge balance", "charge-balanced", "charge density", "Shannon criterion", "biphasic pulse", "asymmetric pulse",
  "stimulation safety",
  "multi-electrode array", "MEA", "microelectrode", "neural interface", "brain-computer interface",
  "DAC quantization", "Intan", "RHS2116", "Multi Channel Systems", "STG4000", "STG5",
  "Tucker-Davis Technologies", "IZ2", "Cortical Labs",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/sanjeevmuthusamy/stimgrid"
Website = "https://bastionoid.com"
Issues = "https://github.com/sanjeevmuthusamy/stimgrid/issues"
Discussions = "https://github.com/sanjeevmuthusamy/stimgrid/discussions"

[project.scripts]
stimgrid = "stimgrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
